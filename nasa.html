<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NASA Lunar Landing Site Navigator</title>
    <script src="data.js"></script>
    <style>
        body { background: #0b0e17; color: #f1f5f9; font-family: sans-serif; padding: 20px; max-width: 1000px; margin: auto; }
        .box { background: #151c2c; padding: 18px; border-radius: 10px; margin-bottom: 18px; border: 1px solid #2d3748; }
        input[type=range] { width: 100%; margin: 10px 0; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-size: 14px; }
        .item { background: #0f1626; padding: 10px; border-radius: 6px; border-left: 3px solid #38bdf8; }
        canvas { width: 100%; height: 260px; background: #0f1626; border-radius: 8px; display: block; margin-top: 10px; }
        .legend { display: flex; gap: 20px; font-size: 13px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h2>Lunar Landing Site Navigator - Shackleton Crater (-89.9 S, 0.0 E)</h2>
    <div class="box">
        <label><b>Interactive Mission Timeline (721 hours):</b></label>
        <input type="range" id="sl" min="0" value="0">
        <div class="grid" id="info"></div>
    </div>
    <div class="box">
        <div class="legend">
            <span><b style="color:#facc15">--</b> Solar Elevation (deg)</span>
            <span><b style="color:#4ade80">--</b> Earth Elevation (deg)</span>
            <span><b style="color:#64748b">--</b> Lunar Horizon (-0.0869 deg)</span>
        </div>
        <canvas id="ch" width="950" height="260"></canvas>
    </div>
    <script>
        var sl = document.getElementById("sl");
        sl.max = d.length - 1;
        function drawChart(curIdx) {
            var c = document.getElementById("ch");
            var ctx = c.getContext("2d");
            ctx.clearRect(0, 0, c.width, c.height);
            var midY = c.height / 2;
            var scaleY = 12;
            ctx.strokeStyle = "#475569";
            ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(c.width, midY); ctx.stroke();
            ctx.setLineDash([]);
            ctx.strokeStyle = "#facc15";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (var i = 0; i < d.length; i++) {
                var x = (i / (d.length - 1)) * c.width;
                var y = midY - (d[i].se * scaleY);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.strokeStyle = "#4ade80";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (var i = 0; i < d.length; i++) {
                var x = (i / (d.length - 1)) * c.width;
                var y = midY - (d[i].ee * scaleY);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();

            var curX = (curIdx / (d.length - 1)) * c.width;
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(curX, 0); ctx.lineTo(curX, c.height); ctx.stroke();
        }
        function show(i) {
            i = parseInt(i);
            var x = d[i];
            var comm = x.ee > -0.0869 ? "<span style='color:#4ade80'>Active</span>" : "<span style='color:#f43f5e'>Passive</span>";
            var sun = x.ts === -1 ? "No sunset" : x.ts + " hours";
            document.getElementById("info").innerHTML =
                "<div class='item'><b>Time (UTC):</b><br>" + x.t + "</div>" +
                "<div class='item' style='border-color:#facc15'><b>Solar Elevation / Azimuth:</b><br>" + x.se + " / " + x.sa + " deg</div>" +
                "<div class='item' style='border-color:#4ade80'><b>Earth Elevation / Azimuth:</b><br>" + x.ee + " / " + x.ea + " deg</div>" +
                "<div class='item' style='border-color:#facc15'><b>Time to Sunset:</b><br>" + sun + "</div>" +
                "<div class='item' style='border-color:#4ade80'><b>Direct Comm Status:</b><br>" + comm + "</div>" +
                "<div class='item'><b>Horizon Angle:</b><br>-0.0869 deg (Airless)</div>";

            drawChart(i);
        }
        sl.oninput = function(e) { show(e.target.value); };
        show(0);
    </script>
</body>
</html>
